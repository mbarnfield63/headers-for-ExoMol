[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "headers-for-ExoMol"
version = "0.1.0"
description = "Labelled headers, CSV conversion and schema sidecars for ExoMol .states/.trans files, derived from their .def file."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
polars = ["polars>=0.20"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7"]

[project.scripts]
exomol-headers = "exomol_headers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
